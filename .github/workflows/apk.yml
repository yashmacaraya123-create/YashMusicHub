name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q InstrumentalizerRemoverV2.zip
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Android SDK setup
        run: |
          SDKM=$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
          yes | $SDKM --licenses > /dev/null || true
          $SDKM "platforms;android-35" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - working-directory: InstrumentalizerRemover
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with: { name: Instrumentalizer-apk, path: InstrumentalizerRemover/app/build/outputs/apk/debug/app-debug.apk }
