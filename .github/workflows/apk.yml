name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q "Instrumentalizer (1).zip"
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Fix folder layout, add Rubber Band and model
        run: |
          cd Instrumentalizer/app/src/main
          mkdir -p cpp
          if [ -d java/cpp ]; then cp -r java/cpp/. cpp/ && rm -rf java/cpp; fi
          cd ../../..
          rm -rf app/src/main/cpp/rubberband
          git clone --depth 1 https://github.com/breakfastquay/rubberband app/src/main/cpp/rubberband
          rm -f app/src/main/assets/PUT_model.onnx_HERE.txt
          curl -fL -o app/src/main/assets/model.onnx https://huggingface.co/ferrite-stems/htdemucs-onnx-dml/resolve/main/htdemucs-dml.onnx
      - name: Android SDK setup
        run: |
          SDKM=$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
          yes | $SDKM --licenses > /dev/null || true
          $SDKM "cmake;3.22.1" "ndk;26.1.10909125" "platforms;android-35" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - working-directory: Instrumentalizer
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with: { name: Instrumentalizer-apk, path: Instrumentalizer/app/build/outputs/apk/debug/app-debug.apk }
